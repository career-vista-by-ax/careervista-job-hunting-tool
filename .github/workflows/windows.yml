name: Windows native acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.12.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Package the tested source
        run: node scripts/package-release.mjs --version "0.1.0-windows-${{ github.run_number }}-${{ github.run_attempt }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CareerVista-windows-x64
          path: |
            release-artifacts/*.zip
            release-artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30
